services:
  mongodb:
    image: mongo:8.0
    ports:
      - "127.0.0.1:${PACT_MONGO_PORT:-27017}:27017"
    volumes:
      - pact-mongodb:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  api:
    image: ${PACT_IMAGE:-ecommercestore-pact:local}
    build:
      context: .
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Mongo__ConnectionString: mongodb://mongodb:27017
      Mongo__DatabaseName: ecommercestore-pact
      RegistryAuth__Publishers__local__TokenSha256: ${PACT_PUBLISHER_TOKEN_SHA256:?Run bash scripts/init-local.sh first}
      RegistryAuth__Publishers__local__ApplicationIds__0: "*"
    ports:
      - "127.0.0.1:${PACT_HTTP_PORT:-5080}:8080"
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  pact-mongodb:
