name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Restore locked dependencies and audit high/critical advisories
        run: bash scripts/ci.sh restore
      - name: Verify source and shell scripts
        run: bash scripts/ci.sh source
      - name: Verify formatting
        run: bash scripts/ci.sh format
      - name: Build
        run: bash scripts/ci.sh build
      - name: Install pinned schema comparison tool
        run: |
          sh scripts/install-oasdiff.sh "$RUNNER_TEMP/pact-tools"
          echo "$RUNNER_TEMP/pact-tools" >> "$GITHUB_PATH"
      - name: Run unit, HTTP and actual MongoDB tests
        run: bash scripts/ci.sh test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: artifacts/tests/
          if-no-files-found: warn

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  container:
    needs: verify
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the candidate image once
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          platforms: linux/amd64
          tags: ecommerce-store-pact:ci
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Smoke test the candidate image with MongoDB
        env:
          PACT_IMAGE: ecommerce-store-pact:ci
          PACT_IMAGE_PREBUILT: "true"
        run: bash scripts/ci.sh container
      - name: Scan the tested image for fixed high/critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ecommerce-store-pact:ci
          scanners: vuln
          format: json
          output: artifacts/container/trivy.json
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - name: Record the tested and scanned image identity
        env:
          EXPECTED_IMAGE_ID: ${{ steps.image.outputs.imageid }}
        run: |
          mkdir -p artifacts/image
          docker image inspect ecommerce-store-pact:ci > "$RUNNER_TEMP/image-inspect.json"
          python3 scripts/image-metadata.py record --inspect "$RUNNER_TEMP/image-inspect.json" --commit "$GITHUB_SHA" --expected-id "$EXPECTED_IMAGE_ID" --out artifacts/image/image.json
      - name: Verify tested-image archive transfer without rebuilding
        run: |
          docker save ecommerce-store-pact:ci --output artifacts/image/pact-image.tar
          docker image rm ecommerce-store-pact:ci
          docker load --input artifacts/image/pact-image.tar
          docker image inspect ecommerce-store-pact:ci > "$RUNNER_TEMP/reloaded-image.json"
          python3 scripts/image-metadata.py verify --inspect "$RUNNER_TEMP/reloaded-image.json" --metadata artifacts/image/image.json --commit "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: pact-tested-image
          path: artifacts/image/
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-smoke
          path: artifacts/container/
          if-no-files-found: warn

  quality-gate:
    if: always()
    needs: [verify, dependency-review, container]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all mandatory checks
        env:
          EVENT_NAME: ${{ github.event_name }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          CONTAINER_RESULT: ${{ needs.container.result }}
          DEPENDENCY_RESULT: ${{ needs.dependency-review.result }}
        shell: bash
        run: |
          set -euo pipefail
          test "$VERIFY_RESULT" = success
          test "$CONTAINER_RESULT" = success
          expected=skipped
          if [[ "$EVENT_NAME" == pull_request ]]; then expected=success; fi
          test "$DEPENDENCY_RESULT" = "$expected"

  publish-image:
    if: ${{ always() && !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.quality-gate.result == 'success' && needs.container.result == 'success' }}
    needs: [quality-gate, container]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      PACT_IMAGE_REPOSITORY: ${{ vars.DOCKER_IMAGE || 'mb0101/ecommerce-store-pact-api' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pact-tested-image
          path: artifacts/image
      - name: Load the tested image and verify its source identity
        run: |
          docker load --input artifacts/image/pact-image.tar
          docker image inspect ecommerce-store-pact:ci > "$RUNNER_TEMP/loaded-image.json"
          python3 scripts/image-metadata.py verify --inspect "$RUNNER_TEMP/loaded-image.json" --metadata artifacts/image/image.json --commit "$GITHUB_SHA"
      - name: Require configured Docker Hub credentials
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USER || secrets.DOCKERHUB_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_TOKEN || secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKER_USERNAME" || { echo 'Missing Docker Hub username secret: DOCKER_USER' >&2; exit 1; }
          test -n "$DOCKER_PASSWORD" || { echo 'Missing Docker Hub token secret: DOCKER_TOKEN' >&2; exit 1; }
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER || secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN || secrets.DOCKERHUB_TOKEN }}
      - name: Publish the loaded tested image without rebuilding
        run: bash scripts/publish-image.sh
      - uses: actions/upload-artifact@v4
        with:
          name: pact-image-reference
          path: artifacts/image/image-reference.json
          if-no-files-found: error
          retention-days: 30
